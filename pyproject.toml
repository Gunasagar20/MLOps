[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-energy-controller"
version = "0.1.0"
description = "Explainable Reinforcement Learning Controller for Flexible Energy Assets in Buildings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Energy ML Team"}
]
dependencies = [
    "numpy==1.26.4",
    "scikit-learn==1.2.2",
    "gymnasium==0.28.1",
    "citylearn==3.0.2",
    "stable-baselines3==2.0.0",
    "torch>=2.0.0",
    "pandas>=2.0.0,<2.3.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "mlflow>=3.0.0",
    "dvc>=3.50.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "notebooks"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F841"]

